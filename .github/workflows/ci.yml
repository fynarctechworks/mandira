name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TRD §6.1 dependency hygiene: a known high or critical vulnerability in a production
      # dependency fails the build. Dependabot proposes the fix weekly.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # CLAUDE.md §5 — Ops, analytics and export code never reference traveler_profiles.
      - run: node scripts/check-privacy-boundary.mjs
      - run: pnpm test
      # The engine carries a 90% coverage gate (TESTING_STRATEGY): a wrong schedule looks
      # exactly like a right one until a traveler misses something.
      - run: pnpm test:engine
      - run: pnpm build
      # TRD-PERF-001. Previously deploy-only, which is how a 513 kB route reached main.
      - run: pnpm check:bundle

  e2e:
    name: Playwright · axe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verify, database]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase with seed data
        run: supabase start && supabase db reset
      # The apps read their Supabase endpoint and keys from the environment. Locally these
      # live in .env.local; here they come from the stack that was just started.
      - name: Export local Supabase environment
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            >> "$GITHUB_ENV"
          echo "MANDHIRA_MAILPIT_URL=http://127.0.0.1:54424" >> "$GITHUB_ENV"
          echo "CRON_SECRET=ci-only-cron-secret-not-a-real-credential" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # When Playwright reports only "Timed out waiting … from config.webServer", say why:
      # start each app the way the config does, probe it, and put the status and the app's
      # own output in annotations, which anyone can read without opening the raw log.
      - name: Explain a server that never answered
        if: failure()
        run: |
          probe() {
            name=$1; port=$2; shift 2
            (cd "apps/$name" && env "$@" NEXT_DIST_DIR=.next-e2e timeout 60 npx next start --port "$port" > "/tmp/$name.log" 2>&1 &)
            sleep 20
            code=$(curl -s -o "/tmp/$name.body" -w '%{http_code}' "http://localhost:$port/" || echo "no answer")
            v4=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/" || echo "no answer")
            v6=$(curl -s -o /dev/null -w '%{http_code}' "http://[::1]:$port/" || echo "no answer")
            out=$(tail -c 1500 "/tmp/$name.log" | tr '\n' ' ')
            body=$(head -c 300 "/tmp/$name.body" 2>/dev/null | tr '\n' ' ')
            echo "::error title=$name server probe::localhost $code, 127.0.0.1 $v4, ::1 $v6. Output: $out Body: $body"
          }
          probe web 3986
          probe ops 3987 NEXT_PUBLIC_TRAVELER_APP_URL=http://localhost:3986
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  database:
    name: Migrations · db lint · pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `db reset` proves the migrations apply cleanly to an empty database —
      # the same guarantee production gets, since migrations are forward-only (D-015).
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from scratch
        run: supabase db reset
      # Scoped to `public`: the extensions schema carries PostGIS's own pre-existing
      # lint findings, which are not ours to fix.
      - name: Lint schema
        run: supabase db lint --schema public --level warning
      - name: Run pgTAP tests
        run: supabase test db
      # Table types are generated, never hand-written (TRD §1.4). This fails the build if
      # someone changed a migration without running `pnpm db:types`.
      - name: Check generated types are current
        run: |
          supabase gen types typescript --local > /tmp/types.ts
          diff -u packages/db/types.ts /tmp/types.ts \
            || { echo "::error::packages/db/types.ts is stale — run 'pnpm db:types' and commit."; exit 1; }
